# Evaluation set for Policy Assistant.
# expected_behaviour: answer or handoff
# must_include / must_not_include: case-insensitive substring checks on the answer text.
# Expected answers come only from the documents in docs/ (public ones from the fetched GOV.UK text).

# ---------- answerable_fictional (14, all 6 current fictional documents) ----------
- id: usage-01
  category: answerable_fictional
  question: "Can my drivers buy AdBlue with their fuel cards?"
  expected_behaviour: answer
  expected_doc_ids: [card-usage]
  must_include: ["AdBlue"]
  notes: "v2.0 allows AdBlue (pump and packaged up to 10 litres) on the 'Fuel, oil and services' or a custom profile. v1.0 did not allow it."

- id: usage-02
  category: answerable_fictional
  question: "Can drivers buy snacks or drinks in the shop with the card?"
  expected_behaviour: answer
  expected_doc_ids: [card-usage]
  notes: "No. Shop items including food and drinks are not allowed on any card."

- id: usage-03
  category: answerable_fictional
  question: "How do I change the product restrictions on one of my cards?"
  expected_behaviour: answer
  expected_doc_ids: [card-usage]
  must_include: ["Restrictions"]
  notes: "Portal: Cards, select card, Restrictions. Fleet Manager or Administrator role. Takes effect within 2 hours."

- id: lost-01
  category: answerable_fictional
  question: "How quickly is a card blocked after I report it lost in the portal?"
  expected_behaviour: answer
  expected_doc_ids: [lost-stolen-cards]
  must_include: ["5 minutes"]
  notes: "Blocked immediately; the block reaches every site within 5 minutes."

- id: lost-02
  category: answerable_fictional
  question: "How long does a standard replacement card take to arrive?"
  expected_behaviour: answer
  expected_doc_ids: [lost-stolen-cards]
  must_include: ["3 working days"]
  notes: "Standard is free within 3 working days. Express next working day if ordered before 2pm, £10 fee."

- id: lost-03
  category: answerable_fictional
  question: "Who pays for fuel bought with a stolen card before I reported it?"
  expected_behaviour: answer
  expected_doc_ids: [lost-stolen-cards]
  notes: "The customer is liable before reporting. A review is possible with a crime reference number sent within 7 days."

- id: inv-01
  category: answerable_fictional
  question: "How often will I receive invoices?"
  expected_behaviour: answer
  expected_doc_ids: [invoicing-billing]
  must_include: ["weekly"]
  notes: "Weekly by default; fortnightly on request; monthly needs approval."

- id: inv-02
  category: answerable_fictional
  question: "How long do I have to dispute a transaction on my invoice?"
  expected_behaviour: answer
  expected_doc_ids: [invoicing-billing]
  must_include: ["60 days"]
  notes: "Within 60 days of the invoice date."

- id: inv-03
  category: answerable_fictional
  question: "When is payment taken for an invoice?"
  expected_behaviour: answer
  expected_doc_ids: [invoicing-billing]
  must_include: ["14 days"]
  notes: "Direct Debit 14 days after the invoice date, next working day if needed."

- id: pin-01
  category: answerable_fictional
  question: "What happens if a driver enters the wrong PIN three times?"
  expected_behaviour: answer
  expected_doc_ids: [pins-security-fraud]
  must_include: ["lock"]
  notes: "PIN locks after 3 incorrect attempts; fleet manager unlocks in portal or by phone, within 10 minutes."

- id: pin-02
  category: answerable_fictional
  question: "What happens when you suspect fraud on one of our cards?"
  expected_behaviour: answer
  expected_doc_ids: [pins-security-fraud]
  must_include: ["block"]
  notes: "Card may be blocked straight away; contact within 1 working hour in business hours; stays blocked until confirmed."

- id: ev-01
  category: answerable_fictional
  question: "Can we use the card to pay for charging at a driver's home?"
  expected_behaviour: answer
  expected_doc_ids: [ev-charging]
  must_include: ["home"]
  notes: "No. Home charging is not covered and cannot be refunded."

- id: ev-02
  category: answerable_fictional
  question: "Which charging networks can my drivers use with the card?"
  expected_behaviour: answer
  expected_doc_ids: [ev-charging]
  must_include: ["VoltLine"]
  notes: "VoltLine, Roadside Rapid, CityCharge Hubs, Northern Grid Points (all fictional)."

- id: carbon-01
  category: answerable_fictional
  question: "How do you work out the CO2 emissions shown in my reports?"
  expected_behaviour: answer
  expected_doc_ids: [carbon-reporting]
  must_include: ["conversion factor"]
  notes: "Litres times a fuel conversion factor; kWh times a UK grid electricity factor; UK Government GHG conversion factors; estimates."

- id: carbon-02
  category: answerable_fictional
  question: "How much does the carbon offsetting scheme cost?"
  expected_behaviour: answer
  expected_doc_ids: [carbon-reporting]
  must_include: ["£15"]
  notes: "£15 per tonne of CO2e, added to the first invoice of the following month."

# ---------- answerable_public (8) ----------
- id: pub-01
  category: answerable_public
  question: "What is the advisory fuel rate for a 1.6 litre petrol car?"
  expected_behaviour: answer
  expected_doc_ids: [advisory-fuel-rates]
  must_include: ["17"]
  notes: "1600cc petrol falls in 1401cc to 2000cc: 17 pence per mile from 1 September 2026."

- id: pub-02
  category: answerable_public
  question: "What is the advisory electricity rate for a fully electric company car charged at home?"
  expected_behaviour: answer
  expected_doc_ids: [advisory-fuel-rates]
  must_include: ["7"]
  notes: "7 pence per mile for home charging from 1 September 2026 (public charging is 15 pence)."

- id: pub-03
  category: answerable_public
  question: "How often does HMRC review the advisory fuel rates?"
  expected_behaviour: answer
  expected_doc_ids: [advisory-fuel-rates]
  notes: "Quarterly: 1 March, 1 June, 1 September and 1 December. Previous rates usable for up to 1 month."

- id: pub-04
  category: answerable_public
  question: "Can we reclaim the VAT on a leased company car?"
  expected_behaviour: answer
  expected_doc_ids: [vat-motoring-expenses]
  must_include: ["50%"]
  notes: "Normally only 50% of the VAT on lease charges for a qualifying car with any private use."

- id: pub-05
  category: answerable_public
  question: "What is the car fuel benefit multiplier for the 2026 to 2027 tax year?"
  expected_behaviour: answer
  expected_doc_ids: [fuel-benefit-company-cars]
  must_include: ["29,200"]
  notes: "£29,200 from 6 April 2026."

- id: pub-06
  category: answerable_public
  question: "How can an employee avoid the fuel benefit charge on private fuel in a company car?"
  expected_behaviour: answer
  expected_doc_ids: [fuel-benefit-company-cars, advisory-fuel-rates]
  notes: "Make good the whole cost of private fuel (by 6 July after the tax year), or fuel only for business travel. Partial repayment gives no reduction."

- id: pub-07
  category: answerable_public
  question: "Is there a separate advisory fuel rate for hybrid cars?"
  expected_behaviour: answer
  expected_doc_ids: [advisory-fuel-rates]
  must_include: ["diesel"]
  notes: "No. Hybrids are treated as petrol or diesel cars."

- id: pub-08
  category: answerable_public
  question: "Can my business reclaim VAT on fuel when we pay employees a mileage allowance?"
  expected_behaviour: answer
  expected_doc_ids: [vat-motoring-expenses]
  must_include: ["fuel element"]
  notes: "Yes, on the fuel element only, using the VAT fraction, with records kept. Advisory fuel rates are accepted."

